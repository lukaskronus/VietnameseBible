# Wasmer registry package for the dailyverse Edge app.
# `wasmer deploy --publish-package` bundles [fs] dirs below and publishes a
# new version; the app then serves it via Static Web Server + settings/config.toml.
[package]
name = "kobayashi123/dailyverse"
version = "0.1.0"
description = "Daily Vietnamese-English Bible verses (static site)"

[dependencies]
"wasmer/static-web-server" = "1"

[fs]
"/public" = "site"
"/settings" = "settings"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["-w", "/settings/config.toml"]
