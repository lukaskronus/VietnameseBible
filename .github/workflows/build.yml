# Phase 1: parse data/*.txt -> build/bible.json + build/validation_report.md
# Phase 2: build_db (bible.json -> bible.sqlite + search_index.json)
#
# All execution happens on GitHub-hosted runners; local machines are
# code storage only (no builds there). Later phases extend this workflow:
#   Phase 3: build_site (bible.json -> static site/)
#   Phase 4: deploy     (publish site/ to the chosen static host)
#
# Action pins are Node 24-native majors (checkout v5, setup-python v6,
# upload/download-artifact v6) to avoid the Node 20 deprecation warning.
name: build

on:
  push:
    paths:
      - "data/**"
      - "tools/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "data/**"
      - "tools/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    name: Parse Bible sources (Phase 1)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Parse data files
        # Exit 1 on hard errors (missing/empty books); warnings stay in the report.
        run: python tools/parse_bible.py --data data --out build

      - name: Upload parsed artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bible-parse
          path: |
            build/bible.json
            build/validation_report.md
          retention-days: 30

  build_db:
    name: Build database artifacts (Phase 2)
    runs-on: ubuntu-latest
    needs: parse
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Phase 1 artifacts
        uses: actions/download-artifact@v6
        with:
          name: bible-parse
          path: parse-in

      - name: Build SQLite + search index
        # Fails on any inconsistency (incl. FTS self-check mismatch).
        run: python tools/build_db.py --json parse-in/bible.json --out build

      - name: Upload database artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bible-db
          path: |
            build/bible.sqlite
            build/search_index.json
          retention-days: 30
