# Phase 1: parse data/xml/*.xml -> build/bible.json + build/validation_report.md
# Phase 2: build_db (bible.json -> bible.sqlite + search/ shards)
# Phase 3: build_site (bible.json + search/ shards -> static site/ + site.zip)
#
# Manual dispatch only. This produces portable site artifacts (site + site.zip)
# from licensed translations in data/xml/. Wasmer deployment (public domain
# web_version builds) lives in deploy.yml and triggers on push.
#
# All execution happens on GitHub-hosted runners; local machines are
# code storage only (no builds there).
#
# Action pins are Node 24-native majors (checkout v5, setup-python v6,
# upload-artifact v6, download-artifact v7) to avoid the Node 20
# deprecation warning. NOTE: download-artifact needed v7 -- v6 still
# targets node20 and triggers the warning.
name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    name: Parse Bible sources (Phase 1)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Parse data files
        # Exit 1 on hard errors (missing/empty books); warnings stay in the report.
        run: python tools/parse_bible.py --data data --out build

      - name: Upload parsed artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bible-parse
          path: |
            build/bible.json
            build/validation_report.md
          retention-days: 30

  build_db:
    name: Build database artifacts (Phase 2)
    runs-on: ubuntu-latest
    needs: parse
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Phase 1 artifacts
        uses: actions/download-artifact@v7
        with:
          name: bible-parse
          path: parse-in

      - name: Check search folding + shard parity (Python vs JS)
        # Both sides of the search folding and shard routing must agree, or
        # Vietnamese search silently returns nothing. node ships on
        # ubuntu-latest.
        run: |
          python tools/check_fold.py > py.txt
          node tools/check_fold.js > js.txt
          diff -u py.txt js.txt

      - name: Build SQLite + search index
        # Fails on any inconsistency (incl. FTS self-check mismatch).
        run: python tools/build_db.py --json parse-in/bible.json --out build

      - name: Upload database artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bible-db
          path: |
            build/bible.sqlite
            build/search
          retention-days: 30

  build_site:
    name: Build static site (Phase 3)
    runs-on: ubuntu-latest
    needs: [parse, build_db]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Phase 1 artifacts
        uses: actions/download-artifact@v7
        with:
          name: bible-parse
          path: parse-in

      - name: Download Phase 2 artifacts
        uses: actions/download-artifact@v7
        with:
          name: bible-db
          path: db-in

      - name: Build static site
        # SITE_BASE_URL is a repo/workflow variable you set before deploying
        # (used for absolute sitemap.xml URLs only); falls back to a
        # placeholder if unset. SITE_BASE_PATH is for subpath hosting.
        run: >
          python tools/build_site.py
          --json parse-in/bible.json
          --index db-in/search
          --out site
          --base-url "${{ vars.SITE_BASE_URL }}"
          --base-path "${{ vars.SITE_BASE_PATH }}"

      - name: Upload site artifact
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: site
          retention-days: 30

      - name: Upload portable site bundle
        # site.zip is written next to --out by build_site.py; use it for
        # nginx/docker hosting without the Wasmer deploy.
        uses: actions/upload-artifact@v6
        with:
          name: site-zip
          path: site.zip
          if-no-files-found: error
          retention-days: 30
