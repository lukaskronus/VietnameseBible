# Phase 4: deploy public domain Bible site (web_version) to Wasmer Edge.
# Builds from data/web_version (USFX, public domain) and deploys.
# Runs on push to data/tools and manually from master.
name: deploy

on:
  push:
    paths:
      - "data/**"
      - "tools/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: Absolute site URL for sitemap (optional)
        required: false
        type: string
      base_path:
        description: Subpath prefix if not served from root (optional)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy_wasmer:
    name: Build and deploy to Wasmer Edge (public domain)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    env:
      SITE_BASE_URL: ${{ inputs.base_url || vars.SITE_BASE_URL }}
      SITE_BASE_PATH: ${{ inputs.base_path || vars.SITE_BASE_PATH }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Parse USFX sources (public domain)
        run: python tools/parse_usfx.py --data data/web_version --out build

      - name: Build SQLite + search index
        run: python tools/build_db.py --json build/bible.json --out build

      - name: Build static site
        run: >
          python tools/build_site.py
          --json build/bible.json
          --index build/search_index.json
          --out site
          --base-url "${{ env.SITE_BASE_URL }}"
          --base-path "${{ env.SITE_BASE_PATH }}"

      - name: Bump package version
        run: sed -i 's/^version = .*$/version = "0.1.${{ github.run_number }}"/' wasmer.toml

      - name: Set up Wasmer CLI
        uses: wasmerio/setup-wasmer@v3

      - name: Deploy site to Wasmer Edge
        run: wasmer deploy --publish-package --non-interactive --no-wait --no-persist-id
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
