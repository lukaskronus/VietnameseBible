<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kt-base" content="${bp}">
<meta name="description" content="${desc}">
<title>${title}</title>

<!-- Favicon -->
<link rel="icon" href="${bp}/favicon.svg" type="image/svg+xml" sizes="any">

<!-- Elegant typography: Spectral for scripture, Source Sans 3 for interface -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="${bp}/assets/style.css">

<script>
try {
  var t = localStorage.getItem("kt-theme");
  if (t) document.documentElement.dataset.theme = t;
  var f = localStorage.getItem("kt-fs");
  if (f) document.documentElement.style.setProperty("--fs", f + "px");
} catch (e) {}
</script>
${head_extra}
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="${bp}/">Kinh Th<span>á</span>nh Song Ngữ Việt – Anh</a>
    <nav class="main">
      <a href="${bp}/">Trang chủ</a>
      ${nav_extra}
      <a href="${bp}/tim-kiem/">Tìm kiếm</a>
    </nav>
    <div class="controls">
      <button id="fs-dec" title="Chữ nhỏ hơn" aria-label="Giảm cỡ chữ">−</button>
      <button id="fs-inc" title="Chữ lớn hơn" aria-label="Tăng cỡ chữ">+</button>
      <button id="theme-btn" title="Chế độ sáng / tối" aria-label="Đổi giao diện" aria-pressed="false">◐</button>
    </div>
  </div>
</header>

<main class="wrap">
${body}
</main>

<footer class="site">
  <div class="wrap">
    <span>${site_name}</span>
    <a class="credit" href="https://github.com/lukaskronus/VietnameseBible" target="_blank" rel="noopener noreferrer" title="Xem nguồn trên GitHub">Code & design · Hirose Kobayashi</a>
  </div>
</footer>
</body>
</html>
