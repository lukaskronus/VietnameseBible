<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kt-base" content="${bp}">
<meta name="description" content="${desc}">
<meta name="theme-color" content="#ece7da">
<title>${title}</title>

<link rel="icon" href="${bp}/favicon.svg" type="image/svg+xml" sizes="any">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Archivo:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="${bp}/assets/style.css">

<script>
try {
  var t = localStorage.getItem("kt-theme");
  if (t) document.documentElement.dataset.theme = t;
  var f = localStorage.getItem("kt-fs");
  if (f) document.documentElement.style.setProperty("--fs", f + "px");
  if (localStorage.getItem("kt-en-show") === "0") document.documentElement.dataset.en = "off";
} catch (e) {}
</script>
${head_extra}
</head>
<body>
<a class="skip" href="#main">Bỏ qua thanh đầu trang</a>
<header class="top">
  <div class="bar">
    <a class="brand" href="${bp}/">Kinh Thánh Song Ngữ</a>
    <nav class="main" aria-label="Chính">
      <a href="${bp}/">Trang chủ</a>
      ${nav_extra}
      <a href="${bp}/tim-kiem/">Tìm kiếm</a>
    </nav>
    <div class="controls">
      <button id="en-btn" type="button" title="Hiện hoặc ẩn bản tiếng Anh" aria-label="EN — hiện hoặc ẩn bản tiếng Anh" aria-pressed="true">EN</button>
      <button id="fs-dec" type="button" title="Chữ nhỏ hơn" aria-label="A− — giảm cỡ chữ">A−</button>
      <button id="fs-inc" type="button" title="Chữ lớn hơn" aria-label="A+ — tăng cỡ chữ">A+</button>
      <button id="theme-btn" type="button" title="Chế độ sáng / tối" aria-label="Đổi giao diện" aria-pressed="false"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg></button>
    </div>
  </div>
</header>

<div class="progress" id="progress" aria-hidden="true"></div>

<main class="wrap" id="main">
${body}
</main>

<footer class="site">
  <div class="wrap">
    <span>${site_name}</span>
    <a class="credit" href="https://github.com/lukaskronus/VietnameseBible" target="_blank" rel="noopener noreferrer" title="Xem nguồn trên GitHub">Code &amp; design · Hirose Kobayashi</a>
  </div>
</footer>
</body>
</html>
