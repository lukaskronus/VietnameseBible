<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="kt-base" content="${bp}">
<meta name="description" content="${desc}">
<title>${title}</title>
<link rel="stylesheet" href="${bp}/assets/style.css">
<script>try{var t=localStorage.getItem("kt-theme");if(t){document.documentElement.dataset.theme=t}var f=localStorage.getItem("kt-fs");if(f){document.documentElement.style.setProperty("--fs",f+"px")}}catch(e){}</script>
${head_extra}
</head>
<body>
<header class="top"><div class="bar">
<a class="brand" href="${bp}/">Kinh Th<span>e</span>nh Song Ngữ Việt - Anh</a>
<nav class="main"><a href="${bp}/">Trang chủ</a>
${nav_extra}
<a href="${bp}/tim-kiem/">Tìm kiếm</a></nav>
<span class="controls">
<button id="fs-dec" title="Chữ nhỏ">A-</button>
<button id="fs-inc" title="Chữ lớn">A+</button>
<button id="theme-btn" title="Sáng/tối">◑</button>
</span></div></header>
<main class="wrap">
${body}
</main>
<footer class="site"><div class="wrap">${site_name}</div></footer>
</body>
</html>
